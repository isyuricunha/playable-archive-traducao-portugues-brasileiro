name: Publicar PT-BR completo
on:
  push:
    branches: [main]
    paths: ['PTBR/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: playable-archive-ptbr-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'isyuricunha/playable-archive-traducao-portugues-brasileiro' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verificar o build sem reconstruí-lo
        run: python -B translation-work/toolkit.py verify-output
      - name: Versionar, empacotar e publicar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B translation-work/release.py
