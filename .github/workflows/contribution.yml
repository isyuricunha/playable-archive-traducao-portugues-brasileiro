name: Consentimento da contribuição
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  consent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Conferir declaração e registro usando o verificador da base
        working-directory: candidate
        run: python -I ../trusted/translation-work/consent.py
